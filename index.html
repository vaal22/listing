<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego del Osito</title>
  <style>
    body {
      background: #ffe4e1;
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #game {
      width: 95vw;
      height: 70vh;
      margin: 20px auto;
      position: relative;
      background: #fff8f0;
      border-radius: 20px;
      box-shadow: 0 0 20px #d8b4a0;
      display: none;
      overflow: hidden;
    }

    #bear {
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 20vw;
      max-width: 120px;
      transition: left 0.1s;
    }

    .heart {
      position: absolute;
      width: 8vw;
      max-width: 40px;
      top: 0;
    }

    #score {
      font-size: 1.2rem;
      color: #b76e79;
      padding: 10px;
    }

    #winner {
      font-size: 1.5rem;
      color: #d72660;
      margin-top: 20px;
      display: none;
    }

    #enter {
      margin-top: 40px;
      padding: 12px 30px;
      font-size: 1.2rem;
      background: #b76e79;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #controls {
      position: absolute;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }

    .arrow {
      font-size: 1.5rem;
      width: 15vw;
      height: 15vw;
      max-width: 70px;
      max-height: 70px;
      border-radius: 50%;
      border: none;
      background: #b76e79;
      color: #fff;
      cursor: pointer;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .arrow:focus {
      outline: none;
    }

    #corazon {
      width: 40%;
      max-width: 200px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <button id="enter">Iniciar Juego</button>
  <div id="game">
    <div id="score">Corazones: 0/10</div>
    <img id="bear" src="https://cdn.pixabay.com/photo/2024/07/01/21/07/teddy-bear-8866107_1280.png" alt="Osito">
    <div id="controls">
      <button class="arrow" id="left">←</button>
      <button class="arrow" id="right">→</button>
    </div>
  </div>
  <div id="winner">
    Felicidades Amor Mío, ¡Robaste Mi Corazón! ❤️
    <br>
    <img id="corazon" src="https://encoded.pe/sanvalentin/mocha6final.gif" alt="corazón">
  </div>

  <script>
    const enter = document.getElementById('enter'),
          game = document.getElementById('game'),
          bear = document.getElementById('bear'),
          scoreDiv = document.getElementById('score'),
          winner = document.getElementById('winner'),
          leftBtn = document.getElementById('left'),
          rightBtn = document.getElementById('right');

    let score = 0, bearX = game.offsetWidth / 2, hearts = [], gi, hi, moveInterval;
    let movingLeft = false, movingRight = false;

    enter.onclick = () => { enter.style.display = 'none'; game.style.display = 'block'; start(); };

    // Movimiento táctil
    leftBtn.addEventListener('touchstart', e => { e.preventDefault(); movingLeft = true; });
    leftBtn.addEventListener('touchend', e => { e.preventDefault(); movingLeft = false; });
    rightBtn.addEventListener('touchstart', e => { e.preventDefault(); movingRight = true; });
    rightBtn.addEventListener('touchend', e => { e.preventDefault(); movingRight = false; });

    // Movimiento con teclado (PC)
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') movingLeft = true;
      if (e.key === 'ArrowRight') movingRight = true;
    });
    document.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft') movingLeft = false;
      if (e.key === 'ArrowRight') movingRight = false;
    });

    function moveBear() {
      if (movingLeft) bearX = Math.max(0, bearX - 5);
      if (movingRight) bearX = Math.min(game.offsetWidth - bear.offsetWidth, bearX + 5);
      bear.style.left = bearX + 'px';
    }

    function start() {
      score = 0;
      scoreDiv.textContent = 'Corazones: 0/10';
      winner.style.display = 'none';
      bearX = game.offsetWidth / 2;
      bear.style.left = bearX + 'px';
      hearts = [];
      gi = setInterval(update, 30);
      hi = setInterval(spawn, 1500);
      moveInterval = setInterval(moveBear, 30);
    }

    function spawn() {
      let h = document.createElement('img');
      h.src = 'https://images.emojiterra.com/google/noto-emoji/animated-emoji/1f493.gif';
      h.className = 'heart';
      h.style.left = Math.floor(Math.random() * (game.offsetWidth - 40)) + 'px';
      h.style.top = '0px';
      game.appendChild(h);
      hearts.push(h);
    }

    function update() {
      const bearRect = bear.getBoundingClientRect();
      for (let i = hearts.length - 1; i >= 0; i--) {
        let h = hearts[i];
        let t = (parseInt(h.style.top) || 0) + 5;
        h.style.top = t + 'px';
        const heartRect = h.getBoundingClientRect();
        if (
          heartRect.bottom >= bearRect.top &&
          heartRect.top <= bearRect.bottom &&
          heartRect.left < bearRect.right &&
          heartRect.right > bearRect.left
        ) {
          score++;
          scoreDiv.textContent = `Corazones: ${score}/10`;
          h.remove();
          hearts.splice(i, 1);
          if (score >= 10) win();
        } else if (t > game.offsetHeight) {
          h.remove();
          hearts.splice(i, 1);
        }
      }
    }

    function win() {
      clearInterval(gi);
      clearInterval(hi);
      clearInterval(moveInterval);
      hearts.forEach(h => h.remove());
      hearts = [];
      game.style.display = 'none';
      winner.style.display = 'block';
    }
  </script>
</body>
</html>
